
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой ИИ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #10131a; color: white;
      font-family: Arial, sans-serif;
    }
    main { max-width: 600px; margin: auto; }
    h1 { color: #72a7ff; text-align: center; }
    #chat {
      height: 65vh; overflow-y: auto; padding: 12px;
      background: #1b202b; border-radius: 14px; margin: 16px 0;
    }
    .msg {
      padding: 12px; margin: 8px 0; border-radius: 10px;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .user { background: #294a78; }
    .bot { background: #303642; }
    form { display: flex; gap: 8px; }
    input {
      min-width: 0; flex: 1; padding: 13px;
      border-radius: 10px; border: 0; font-size: 16px;
    }
    button {
      padding: 12px; border: 0; border-radius: 10px;
      background: #72a7ff; color: #10131a; font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>🤖 Мой ИИ</h1>
    <div id="chat" aria-live="polite">
      <div class="msg bot">Привет! Я твой ИИ-помощник. Напиши мне сообщение 😊</div>
    </div>
    <form id="form">
      <input id="message" placeholder="Напиши сообщение..." autocomplete="off" required>
      <button type="submit">➤</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
